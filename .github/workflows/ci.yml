name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go mod tidy diff
        run: go mod tidy -diff

      - name: boundary static checks
        run: go run ./scripts/boundary-check

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.0

      - name: go test race
        run: go test -race ./...

      - name: mutation and static negative checks
        run: go run ./scripts/mutation-check

      - name: consumer and CLI negative checks
        run: python3 scripts/dx-mutation-check.py
